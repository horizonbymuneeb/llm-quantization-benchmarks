name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q src tests

      - name: Run the test suite
        run: python -m pytest -q

      - name: Smoke-test the CLI on a reduced sweep
        run: |
          python - <<'PY'
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("config.yaml").read_text())
          cfg["model"]["epochs"] = 3
          cfg["model"]["hidden_sizes"] = [16]
          cfg["data"]["n_samples"] = 300
          cfg["formats"] = ["fp32", "int8"]
          cfg["schemes"] = ["symmetric"]
          cfg["granularities"] = ["per_channel"]
          cfg["include_sensitivity"] = False
          cfg["output_dir"] = "reports"
          pathlib.Path("config.ci.yaml").write_text(yaml.safe_dump(cfg))
          PY
          python -m quantbench.cli sweep --config config.ci.yaml --quiet
          test -f reports/sweep_report.json
          python -c "import json; d=json.load(open('reports/sweep_report.json')); assert d['rows'], 'empty report'"

      - name: Verify the package imports cleanly
        run: python -c "import sys; sys.path.insert(0, 'src'); import quantbench; print(quantbench.__version__)"
