# Benchmark tunables. Every value here is read by src/quantbench/config.py;
# unknown keys raise at load time rather than being ignored.

model:
  hidden_sizes: [64, 32]
  activation: relu
  batch_size: 64
  epochs: 40
  learning_rate: 0.05
  weight_decay: 0.0001
  seed: 7

data:
  n_samples: 2400
  n_features: 12
  n_classes: 5
  n_informative: 8
  class_sep: 0.8
  noise: 1.0
  test_fraction: 0.3
  seed: 11
  generator: clusters

calibration:
  # one of: minmax, percentile, entropy, mse
  method: entropy
  percentile: 99.9
  n_bins: 2048
  n_calibration_samples: 256
  seed: 3

# Float formats expand to one row each; integer formats expand across
# schemes x granularities.
formats: [fp32, bf16, int8, int4]
schemes: [symmetric, asymmetric]
granularities: [per_tensor, per_channel]

weight_layers_only: true
include_sensitivity: true
sensitivity_top_k: 2

output_dir: reports
report_name: sweep_report.json
